<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Dashboard</title>
<style>
:root { --glass:rgba(255,255,255,.08); --border:rgba(255,255,255,.15); --text:#fff; --muted:#9ca3af; --active:#22c55e; }
* { margin:0; padding:0; box-sizing:border-box; font-family:"SF Pro Display",system-ui,sans-serif; }
body { background:radial-gradient(circle at top left,#1f2937,#0f172a 40%,#050816); color:var(--text); min-height:100vh; }
.dashboard { min-height:100vh; padding:24px; display:grid; grid-template-columns:1fr 1.6fr; grid-template-rows:minmax(300px,auto) 1fr; gap:20px; }
.card { background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:28px; box-shadow:0 8px 32px rgba(0,0,0,.25); }
.clock-card { padding:25px 35px; display:flex; flex-direction:column; justify-content:center; }
.time { font-size:clamp(4rem,8vw,6rem); font-weight:700; letter-spacing:-3px; }
.date { color:var(--muted); font-size:1.5rem; margin-top:10px; }
.weather-card { padding:28px; display:flex; flex-direction:column; gap:20px; min-width:0; }
.weather-top { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.weather-location { color:var(--muted); font-size:1rem; overflow-wrap:anywhere; }
.location-button,.todo-form button { margin-top:9px; padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.08); color:var(--text); cursor:pointer; }
.location-button:hover,.todo-form button:hover,.todo-action:hover { background:rgba(255,255,255,.16); }
.location-status { color:var(--muted); font-size:.85rem; margin-top:7px; min-height:1.2em; }
.current-weather { display:flex; align-items:center; gap:14px; text-align:right; }
.current-icon { font-size:3.5rem; }
.current-temp { font-size:clamp(3rem,6vw,4.5rem); font-weight:700; }
.current-description { color:var(--muted); }
.hourly-heading { font-size:1.15rem; font-weight:600; margin-bottom:12px; }
.hourly-forecast { display:grid; grid-auto-columns:minmax(78px,1fr); grid-auto-flow:column; gap:10px; overflow-x:auto; padding:2px 2px 10px; scrollbar-color:rgba(255,255,255,.3) transparent; }
.hour-item { min-width:78px; padding:12px 8px; border:1px solid rgba(255,255,255,.09); border-radius:18px; background:rgba(255,255,255,.045); text-align:center; }
.hour-time,.hour-rain { color:var(--muted); font-size:.85rem; }
.hour-icon { font-size:1.6rem; margin:7px 0; }
.hour-temp { font-size:1.2rem; font-weight:650; margin-bottom:7px; }
.hour-rain { white-space:nowrap; }
.rain-summary { color:var(--muted); font-size:.9rem; }
.todo-card { padding:28px; display:flex; flex-direction:column; min-width:0; }
.section-title { font-size:1.4rem; margin-bottom:16px; }
.todo-form { display:flex; gap:8px; margin-bottom:14px; }
.todo-form input { flex:1; min-width:0; padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.08); color:var(--text); font-size:1rem; }
.todo-form input::placeholder { color:var(--muted); }
.todo-form input:focus,.todo-edit-input:focus { outline:2px solid rgba(59,130,246,.7); outline-offset:1px; }
.todo-form button { margin:0; padding-inline:16px; }
.todo-list { list-style:none; overflow-y:auto; }
.todo-list li { display:flex; align-items:center; gap:9px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:1.05rem; }
.todo-list input[type=checkbox] { flex:0 0 auto; width:20px; height:20px; accent-color:var(--active); }
.todo-text { flex:1; min-width:0; overflow-wrap:anywhere; }
.todo-list li.completed .todo-text { color:var(--muted); text-decoration:line-through; }
.todo-edit-input { flex:1; min-width:0; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.08); color:var(--text); font:inherit; }
.todo-action { flex:0 0 auto; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.06); color:var(--muted); cursor:pointer; padding:6px 9px; font-size:.9rem; }
.controls { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.widget { cursor:pointer; transition:.25s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:24px; background:rgba(255,255,255,.05); }
.widget:hover { transform:translateY(-3px); }
.widget.active { background:rgba(34,197,94,.25); border:1px solid rgba(34,197,94,.4); }
.icon { font-size:3rem; } .label { font-size:1.15rem; }
.bottom-grid { display:grid; grid-template-columns:1.2fr 1fr; gap:20px; min-height:250px; }
@media(max-width:800px) { .dashboard { grid-template-columns:1fr; grid-template-rows:auto; padding:14px; } .clock-card { min-height:200px; } .weather-card { min-height:310px; padding:20px; } .bottom-grid { grid-template-columns:1fr; } .todo-card { min-height:280px; } .controls { min-height:160px; } }
</style>
</head>
<body>
<div class="dashboard">
    <div class="card clock-card"><div id="time" class="time">12:00</div><div id="date" class="date"></div></div>
    <section class="card weather-card" aria-label="Sääennuste">
        <div class="weather-top"><div>
            <div id="weatherLocation" class="weather-location">Sijaintia ei valittu</div>
            <button id="locationButton" class="location-button" type="button" onclick="requestLocation()">Hae sää sijainnin perusteella</button>
            <div id="locationStatus" class="location-status" aria-live="polite">Sääennusteen näyttämiseen tarvitaan sijaintilupa.</div>
        </div><div class="current-weather"><div><div id="currentTemp" class="current-temp">—°</div><div id="currentDescription" class="current-description">Ei säädataa</div></div><div id="currentIcon" class="current-icon" aria-hidden="true">🌤️</div></div></div>
        <div><h2 class="hourly-heading">Tuntiennuste ja sade</h2><div id="rainSummary" class="rain-summary">Sateen ennuste näkyy sijainnin haun jälkeen.</div><div id="hourlyForecast" class="hourly-forecast" aria-live="polite"></div></div>
    </section>
    <div class="bottom-grid">
        <section class="card todo-card" aria-label="Tehtävälista">
            <h2 class="section-title">🏠 Perheen yhteiset asiat</h2>
            <form id="todoForm" class="todo-form"><input id="todoInput" type="text" maxlength="120" placeholder="Kirjoita uusi tehtävä…" aria-label="Uusi tehtävä" required><button type="submit">Lisää</button></form>
            <ul id="todoList" class="todo-list"></ul>
        </section>
        <div class="controls">
            <div class="card widget" onclick="toggleWidget(this)"><div class="icon">💡</div><div class="label">Valaistus</div></div>
            <div class="card widget" onclick="toggleWidget(this)"><div class="icon">🎵</div><div class="label">Musiikki</div></div>
            <div class="card widget" onclick="toggleWidget(this)"><div class="icon">🛡️</div><div class="label">Turvallisuus</div></div>
        </div>
    </div>
</div>
<script>
function updateClock() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString("fi-FI", {hour:"2-digit",minute:"2-digit"});
    const date = now.toLocaleDateString("fi-FI", {weekday:"long",day:"numeric",month:"long",year:"numeric"});
    document.getElementById("date").textContent = date.charAt(0).toUpperCase() + date.slice(1);
}
setInterval(updateClock,1000); updateClock();

const defaultTodos = ["Vie roskat","Muista kauppa","Lasten harrastus klo 18","Tarkista postit","Kastele kasvit"];
let todos;
try {
    const stored = localStorage.getItem("homeDashboardTodos");
    const parsed = stored ? JSON.parse(stored) : null;
    todos = Array.isArray(parsed) ? parsed.map(item => ({text:String(item?.text || "").trim(),done:Boolean(item?.done)})).filter(item => item.text) : defaultTodos.map(text => ({text,done:false}));
} catch { todos = defaultTodos.map(text => ({text,done:false})); }
function saveTodos() { try { localStorage.setItem("homeDashboardTodos",JSON.stringify(todos)); } catch(error) { console.warn("Tehtävien tallennus ei onnistunut.",error); } }

function renderTodos() {
    const list = document.getElementById("todoList");
    list.replaceChildren();
    todos.forEach((todo,index) => {
        const row = document.createElement("li");
        if (todo.done) row.classList.add("completed");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox"; checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label",`Merkitse tehtävä ${todo.text} tehdyksi`);
        checkbox.addEventListener("change",() => { todos[index].done = checkbox.checked; saveTodos(); renderTodos(); });
        const label = document.createElement("span"); label.className = "todo-text"; label.textContent = todo.text;
        const edit = document.createElement("button"); edit.type = "button"; edit.className = "todo-action"; edit.textContent = "Muokkaa";
        edit.setAttribute("aria-label",`Muokkaa tehtävää ${todo.text}`);
        edit.addEventListener("click",() => beginTodoEdit(index,row,label));
        const remove = document.createElement("button"); remove.type = "button"; remove.className = "todo-action"; remove.textContent = "Poista";
        remove.setAttribute("aria-label",`Poista tehtävä ${todo.text}`);
        remove.addEventListener("click",() => { todos.splice(index,1); saveTodos(); renderTodos(); });
        row.append(checkbox,label,edit,remove); list.appendChild(row);
    });
}

function beginTodoEdit(index,row,label) {
    const editor = document.createElement("input");
    editor.type = "text"; editor.maxLength = 120; editor.value = todos[index].text; editor.className = "todo-edit-input";
    editor.setAttribute("aria-label","Muokkaa tehtävän tekstiä");
    let finished = false;
    const finish = (save) => {
        if (finished) return;
        finished = true;
        const text = editor.value.trim();
        if (save && text) todos[index].text = text;
        else if (save && !text) todos.splice(index,1);
        saveTodos();
        renderTodos();
    };
    editor.addEventListener("keydown",(event) => {
        if (event.key === "Enter") { event.preventDefault(); finish(true); }
        if (event.key === "Escape") { event.preventDefault(); finish(false); }
    });
    editor.addEventListener("blur",() => finish(true));
    row.replaceChild(editor,label);
    editor.focus(); editor.select();
}

document.getElementById("todoForm").addEventListener("submit",event => {
    event.preventDefault();
    const input = document.getElementById("todoInput"); const text = input.value.trim();
    if (!text) return;
    todos.push({text,done:false}); saveTodos(); renderTodos(); input.value = ""; input.focus();
});
renderTodos();

function describeWeather(code) {
    if(code===0)return{icon:"☀️",text:"Selkeää"}; if(code===1)return{icon:"🌤️",text:"Enimmäkseen selkeää"}; if(code===2)return{icon:"⛅",text:"Puolipilvistä"}; if(code===3)return{icon:"☁️",text:"Pilvistä"};
    if([45,48].includes(code))return{icon:"🌫️",text:"Sumua"}; if([51,53,55,56,57].includes(code))return{icon:"🌦️",text:"Tihkusadetta"}; if([61,63,65,66,67,80,81,82].includes(code))return{icon:"🌧️",text:"Sadetta"}; if([71,73,75,77,85,86].includes(code))return{icon:"🌨️",text:"Lumisadetta"}; if([95,96,99].includes(code))return{icon:"⛈️",text:"Ukkosta"}; return{icon:"🌡️",text:"Sää"};
}
async function loadWeather(latitude,longitude) {
    const status=document.getElementById("locationStatus"); status.textContent="Haetaan tuntiennustetta…";
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,precipitation,weather_code&forecast_days=2&timezone=auto`;
    try {
        const response=await fetch(url); if(!response.ok) throw new Error("Sääpalvelun haku epäonnistui"); const data=await response.json();
        const current=describeWeather(data.current.weather_code); document.getElementById("currentTemp").textContent=`${Math.round(data.current.temperature_2m)}°`; document.getElementById("currentDescription").textContent=current.text; document.getElementById("currentIcon").textContent=current.icon;
        const forecast=document.getElementById("hourlyForecast"); forecast.replaceChildren(); const now=new Date(); const found=data.hourly.time.findIndex(time=>new Date(time)>=now); const start=Math.max(0,found); const hours=data.hourly.time.slice(start,start+12); let maxChance=0,totalRain=0;
        hours.forEach((time,offset)=>{ const i=start+offset; const chance=data.hourly.precipitation_probability[i]??0; const rain=data.hourly.precipitation[i]??0; maxChance=Math.max(maxChance,chance); totalRain+=rain; const weather=describeWeather(data.hourly.weather_code[i]); const item=document.createElement("div"); item.className="hour-item"; item.textContent=`${new Date(time).toLocaleTimeString("fi-FI",{hour:"2-digit",minute:"2-digit"})} ${weather.icon} ${Math.round(data.hourly.temperature_2m[i])}° 💧 ${chance}% · ${rain.toFixed(1)} mm`; forecast.appendChild(item); });
        document.getElementById("rainSummary").textContent=`Seuraavan ${hours.length} tunnin aikana: sateen todennäköisyys enintään ${maxChance} %, ennustettu sademäärä yhteensä ${totalRain.toFixed(1)} mm.`;
        status.textContent=`Päivitetty ${new Date().toLocaleTimeString("fi-FI",{hour:"2-digit",minute:"2-digit"})}.`;
    } catch { status.textContent="Säätietojen haku epäonnistui. Tarkista internetyhteys ja yritä uudelleen."; }
}
function requestLocation() {
    const status=document.getElementById("locationStatus");
    if(!navigator.geolocation){status.textContent="Selaimesi ei tue sijainnin hakemista.";return;}
    status.textContent="Pyydetään sijaintilupaa…";
    navigator.geolocation.getCurrentPosition(position=>{const{latitude,longitude,accuracy}=position.coords;document.getElementById("weatherLocation").textContent=`${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;status.textContent=`Sijainti saatu (tarkkuus noin ${Math.round(accuracy)} m).`;loadWeather(latitude,longitude);},error=>{if(error.code===error.PERMISSION_DENIED)status.textContent="Sijaintilupaa ei annettu.";else if(error.code===error.POSITION_UNAVAILABLE)status.textContent="Sijaintia ei saatu tällä hetkellä.";else status.textContent="Sijainnin haku aikakatkaistiin. Yritä uudelleen.";},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function toggleWidget(el){el.classList.toggle("active");}
</script>
</body>
</html>
